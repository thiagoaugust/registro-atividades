name: Build & SonarQube

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          mvn clean verify
