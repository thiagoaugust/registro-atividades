quarkus.application.name=registro-atividades
quarkus.http.port=8080

# ---------------------------------------------------------------- banco
# dev e test nao definem jdbc.url de proposito: os Dev Services sobem o Postgres em container
# sozinhos (o equivalente Quarkus a um Testcontainers ja plugado).
quarkus.datasource.db-kind=postgresql
# Mesma imagem do compose: sem isso o Dev Services puxa a ultima major (18) e dev/test rodariam num
# Postgres diferente do de producao.
quarkus.datasource.devservices.image-name=postgres:16-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Flyway manda no schema; Hibernate so confere se o mapeamento bate com o que a migration criou.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
# O JSONB nao usa o ObjectMapper do REST: customizacao feita para endpoint nao deve mexer em como o
# dado e gravado no banco (sera o default em versoes futuras do Quarkus).
quarkus.hibernate-orm.mapping.format.global=ignore

# ---------------------------------------------------------------- autenticacao
# Usuario unico vindo da config. Sem tabela de usuario: nao ha cadastro, nem troca de senha, nem
# multiusuario na v1 (ver docs/PLANO.md 1.1).
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=${APP_PASSWORD:admin}
quarkus.security.users.embedded.roles.admin=user

# Form auth com as paginas vazias: em vez de redirecionar, responde codigo HTTP — o que uma SPA quer.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.post-location=/api/sessao/login
quarkus.http.auth.form.logout-path=/api/sessao/logout
quarkus.http.auth.form.cookie-name=registro_sessao
quarkus.http.auth.form.timeout=PT168H
quarkus.http.auth.form.new-cookie-interval=PT24H

quarkus.http.auth.permission.publicas.paths=/q/health/*,/q/openapi,/q/swagger-ui/*,/api/sessao/login
quarkus.http.auth.permission.publicas.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# ---------------------------------------------------------------- gamificacao
# Pesos e tetos do XP e da classificacao do dia (docs/PLANO.md secao 3). Mudar um numero aqui e
# recalcular o dia; nada disso esta fixo no codigo.
gamificacao.xp.multiplicadores.TREINO=1.0
gamificacao.xp.multiplicadores.ESTUDO=1.0
gamificacao.xp.multiplicadores.LEITURA=0.8
gamificacao.xp.multiplicadores.DESAFIO=1.2
gamificacao.xp.multiplicadores.PROJETO=1.1
gamificacao.xp.teto-diario-categoria=120
gamificacao.xp.teto-gtd-diario=30
gamificacao.xp.pontos-por-acao-gtd=5
gamificacao.xp.pontos-revisao-semanal=50
gamificacao.xp.bonus-equilibrio=0.15
gamificacao.xp.categorias-para-equilibrio=3

gamificacao.indice.peso-dificuldade=0.30
gamificacao.indice.peso-energia=0.25
gamificacao.indice.peso-sono=0.20
gamificacao.indice.peso-humor=0.15
gamificacao.indice.peso-estresse=0.10
gamificacao.indice.k=0.40
gamificacao.indice.dias-janela=28
gamificacao.indice.dias-minimos-baseline=7
gamificacao.indice.escala-z=15.0
gamificacao.indice.limite-normal=35
gamificacao.indice.limite-bom=60
gamificacao.indice.limite-excelente=80
gamificacao.indice.adversidade-vitoria=0.60
gamificacao.indice.objetivo-vitoria=45

# ---------------------------------------------------------------- dev
# Sem CORS: o Vite faz proxy de /api em dev e o nginx em producao, entao o browser sempre ve a mesma
# origem — o que tambem e o que faz o cookie de sessao funcionar sem configuracao extra.
%dev.quarkus.log.category."br.dev.registro".level=DEBUG

%test.quarkus.http.auth.form.timeout=PT5M
# Senha fixa nos testes: o .env da maquina nao pode mudar o resultado da suite.
%test.quarkus.security.users.embedded.users.admin=admin

# ---------------------------------------------------------------- demo
# `./mvnw quarkus:dev -Dquarkus.profile=demo` em desenvolvimento;
# `QUARKUS_PROFILE=demo,prod docker compose up` em container (demo manda, prod da o banco).
# A semeadura so roda com o banco vazio — ver DadosDemo.
%demo.quarkus.log.category."br.dev.registro".level=DEBUG
